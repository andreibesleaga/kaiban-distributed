# SPDX-License-Identifier: GPL-3.0-only
apiVersion: v1
kind: ConfigMap
metadata:
  name: kaiban-research-config
data:
  REDIS_URL: "redis://kaiban-redis:6379"
  MESSAGING_DRIVER: "bullmq"
  PORT: "3000"
  SERVICE_NAME: "kaiban-gateway"
  AGENT_IDS: "searcher,writer,reviewer,editor"
  LLM_MODEL: "gpt-4o-mini"
  # Emergency STOP ALL (2.1.0, ADR-025): "true" turns it on (also set BOARD_JWT_SECRET).
  CONTROL_PLANE_ENABLED: "false"
  CHAOS_MODE: "false"
---
apiVersion: v1
kind: Secret
metadata:
  name: kaiban-research-secrets
type: Opaque
stringData:
  # Plain-text values (stringData; Kubernetes encodes them), or manage the Secret with an external secret operator.
  # Replace OPENAI_API_KEY before applying. Leave OPENROUTER_API_KEY empty unless you use OpenRouter:
  # when it is set it takes precedence over OPENAI_API_KEY.
  OPENAI_API_KEY: "sk-..."
  OPENROUTER_API_KEY: ""
