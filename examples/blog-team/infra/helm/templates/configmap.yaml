apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "kaiban-blog-team.fullname" . }}-config
  labels:
    {{- include "kaiban-blog-team.labels" . | nindent 4 }}
data:
  REDIS_URL: {{ .Values.config.REDIS_URL | default (printf "redis://%s-redis:6379" (include "kaiban-blog-team.fullname" .)) | quote }}
  MESSAGING_DRIVER: {{ .Values.config.MESSAGING_DRIVER | quote }}
  PORT: {{ .Values.gateway.port | quote }}
  SERVICE_NAME: "kaiban-gateway"
  AGENT_IDS: "researcher,writer,editor"
  LLM_MODEL: {{ .Values.config.LLM_MODEL | quote }}
  CONTROL_PLANE_ENABLED: {{ .Values.config.CONTROL_PLANE_ENABLED | default "false" | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "kaiban-blog-team.fullname" . }}-secrets
  labels:
    {{- include "kaiban-blog-team.labels" . | nindent 4 }}
type: Opaque
data:
  OPENAI_API_KEY: {{ .Values.secrets.OPENAI_API_KEY | b64enc | quote }}
  OPENROUTER_API_KEY: {{ .Values.secrets.OPENROUTER_API_KEY | b64enc | quote }}
  {{- with .Values.secrets.BOARD_JWT_SECRET }}
  BOARD_JWT_SECRET: {{ . | b64enc | quote }}
  {{- end }}
  {{- with .Values.secrets.CHANNEL_SIGNING_SECRET }}
  CHANNEL_SIGNING_SECRET: {{ . | b64enc | quote }}
  {{- end }}
