services:
  redis:
    image: redis:7-alpine
    command: redis-server ${REDIS_PASSWORD:+--requirepass ${REDIS_PASSWORD}}
    ports:
      - "127.0.0.1:6379:6379"
    environment:
      # Read by the healthcheck below (the shell inside the container expands it).
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    healthcheck:
      # With a password set, authenticate; without one, plain PING. grep makes an AUTH/NOAUTH
      # error fail the check instead of passing on redis-cli's exit code.
      test:
        [
          "CMD-SHELL",
          "redis-cli $${REDIS_PASSWORD:+--no-auth-warning -a \"$$REDIS_PASSWORD\"} ping | grep -q PONG",
        ]
      interval: 5s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "2181"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "127.0.0.1:9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,PLAINTEXT_INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT_INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      # Auto-created task topics get 4 partitions, so up to 4 replicas of one
      # agent share a queue (one partition serves one consumer at a time).
      KAFKA_NUM_PARTITIONS: "4"
    healthcheck:
      test:
        [
          "CMD",
          "kafka-topics",
          "--bootstrap-server",
          "localhost:9092",
          "--list",
        ]
      interval: 15s
      timeout: 10s
      retries: 15
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

  # Gateway role (ADR-013): HTTP / WebSocket / A2A front door. Exposes /health;
  # builds NO task-consuming actors. This is what the board connects to.
  kaiban-gateway:
    build:
      context: .
      args:
        ROLE: gateway
    depends_on:
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      ROLE: gateway
      # With REDIS_PASSWORD set in .env the URL carries it (use a URL-safe password: `openssl rand -hex 24`).
      REDIS_URL: redis://${REDIS_PASSWORD:+:${REDIS_PASSWORD}@}redis:6379
      # Emergency STOP ALL (ADR-025): set true on every service to enable it.
      CONTROL_PLANE_ENABLED: ${CONTROL_PLANE_ENABLED:-}
      # Board/HTTP stop commands need a board token (unset = board auth off, stop refused).
      BOARD_JWT_SECRET: ${BOARD_JWT_SECRET:-}
      KAFKA_BROKERS: kafka:29092
      KAFKA_CLIENT_ID: kaiban-gateway
      KAFKA_GROUP_ID: kaiban-group
      MESSAGING_DRIVER: bullmq
      PORT: "3000"
      SERVICE_NAME: kaiban-gateway
      # The agent ids the workers run: one A2A skill each on the agent card.
      AGENT_IDS: researcher,writer
    restart: on-failure
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

  # Worker role (ADR-013): LLM-backed task-consuming agent pool. No HTTP surface,
  # so no /health probe. Scale this tier independently of the gateway.
  kaiban-worker:
    build:
      context: .
      args:
        ROLE: worker
    depends_on:
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      ROLE: worker
      # With REDIS_PASSWORD set in .env the URL carries it (use a URL-safe password: `openssl rand -hex 24`).
      REDIS_URL: redis://${REDIS_PASSWORD:+:${REDIS_PASSWORD}@}redis:6379
      # Emergency STOP ALL (ADR-025): set true on every service to enable it.
      CONTROL_PLANE_ENABLED: ${CONTROL_PLANE_ENABLED:-}
      KAFKA_BROKERS: kafka:29092
      KAFKA_CLIENT_ID: kaiban-worker
      KAFKA_GROUP_ID: kaiban-group
      MESSAGING_DRIVER: bullmq
      SERVICE_NAME: kaiban-worker
      AGENT_IDS: researcher,writer
      # LLM credentials (buildLLMConfig): OpenRouter takes precedence when its key is set.
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      LLM_MODEL: ${LLM_MODEL:-gpt-4o-mini}
      # Per-agent and per-task token caps (defaults 200000 / 50000; the literal `unlimited` removes one, 0 does not).
      MAX_TOKEN_BUDGET: ${MAX_TOKEN_BUDGET:-200000}
      MAX_TASK_TOKEN_BUDGET: ${MAX_TASK_TOKEN_BUDGET:-50000}
    restart: on-failure
    # Worker role has no HTTP /health — disable the inherited Dockerfile probe.
    healthcheck:
      disable: true
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
