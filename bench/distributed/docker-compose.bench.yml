# Bench infrastructure: same images as the repo's docker-compose.yml, WITHOUT the
# per-container CPU/memory caps (those caps would measure Docker throttling, not the runtime).
# Kafka: 8 partitions by default so N=8 workers can all consume (the repo default is 4).
name: kaiban-bench
services:
  redis:
    image: redis:7-alpine
    ports: ["127.0.0.1:6379:6379"]
    healthcheck: {test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"], interval: 2s, timeout: 3s, retries: 15}
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    environment: {ZOOKEEPER_CLIENT_PORT: 2181, ZOOKEEPER_TICK_TIME: 2000}
    healthcheck: {test: ["CMD", "nc", "-z", "localhost", "2181"], interval: 5s, timeout: 5s, retries: 20, start_period: 10s}
  kafka:
    image: confluentinc/cp-kafka:7.6.0
    depends_on: {zookeeper: {condition: service_healthy}}
    ports: ["127.0.0.1:9092:9092"]
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,PLAINTEXT_INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT_INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_NUM_PARTITIONS: "8"
      KAFKA_DELETE_TOPIC_ENABLE: "true"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
    healthcheck: {test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:9092", "--list"], interval: 5s, timeout: 10s, retries: 20, start_period: 15s}
