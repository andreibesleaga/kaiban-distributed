name: Pages

# Publishes the one-page project site in site/ to GitHub Pages
# (https://andreibesleaga.github.io/kaiban-distributed/). The Markdown in docs/ is NOT published.
# One-time setup by the owner: enable Pages with build_type=workflow
#   gh api -X POST repos/andreibesleaga/kaiban-distributed/pages -f build_type=workflow

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy site/ to GitHub Pages
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v5
