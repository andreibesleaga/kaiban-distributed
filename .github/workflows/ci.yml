name: CI

# Fast quality + security gates on every push/PR. Heavy e2e (Redis/Kafka) and
# chaos/mutation/bench run in nightly.yml. Actions are pinned to commit SHAs (the
# version is in the trailing comment); Dependabot (github-actions) keeps them current.

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Quality (lint · typecheck · 100% coverage · arch)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: "npm"
      # npm 11.17.0, the npm Dependabot writes lockfiles with: a lockfile written by npm 11
      # can omit optional nested entries that npm 10 (bundled with Node 22) then reports
      # as "Missing ... from lock file". Keep in step with packageManager in package.json.
      - name: Use npm 11.17.0
        run: npm install -g npm@11.17.0
      - run: npm ci
      - name: Lint (zero errors)
        run: npm run lint
      - name: Typecheck (zero errors)
        run: npm run typecheck
      - name: Architecture (no circular imports)
        run: npm run lint:arch
      - name: API surface gate (api-extractor — fails on undocumented public-API drift)
        run: npm run api:check
      - name: Unit tests + coverage (enforced 100% of src/**)
        run: npm run test:coverage
      - name: Upload coverage report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: coverage
          path: coverage/

  board:
    name: Board UI (audit · typecheck · build · tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: board
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: board/package-lock.json
      - name: Use npm 11.17.0
        run: npm install -g npm@11.17.0
      - run: npm ci
      # Gate the board on HIGH+ advisories too (root has this; the board
      # previously had no audit step, which let an esbuild HIGH go uncaught).
      - name: Dependency audit (fail on HIGH+)
        run: npm audit --audit-level=high
      # `build` is `tsc --noEmit && vite build` — typechecks then bundles.
      - run: npm run build
      - run: npm test

  security:
    name: Security (audit · secrets · SBOM · OSV)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: "npm"
      - name: Use npm 11.17.0
        run: npm install -g npm@11.17.0
      - run: npm ci
      # ADR-011: no copyleft licence among the runtime dependencies of the Apache-2.0 library.
      # The starred names are licence-checker guesses from a LICENSE or README file (each checked:
      # @browserbasehq/sdk and @mistralai/mistralai are Apache-2.0, @kaibanjs/workflow MIT,
      # readline BSD); a guessed copyleft licence (for example GPL*) still fails.
      - name: Licence check (production dependencies)
        run: npx --yes license-checker@25.0.1 --production --summary --onlyAllow "MIT;MIT*;Apache-2.0;Apache*;ISC;BSD-2-Clause;BSD-3-Clause;BSD*;0BSD;BlueOak-1.0.0;Python-2.0"
      # Fails on HIGH+ except the dated exceptions in .trivyignore (each explained in SECURITY.md).
      - name: Dependency audit (fail on HIGH+; moderates and exceptions triaged in SECURITY.md)
        run: node scripts/audit-gate.js
      - name: Generate CycloneDX 1.6 SBOM
        # --ignore-npm-errors: `npm ls` exits non-zero on a harmless dev-only peer
        # mismatch (madge→precinct wants TypeScript 5.x while the project pins 6.x);
        # the installed tree is valid, so the SBOM is still complete and accurate.
        run: npx --yes @cyclonedx/cyclonedx-npm@6.0.1 --ignore-npm-errors --output-format JSON --spec-version 1.6 --output-file sbom.json
      - name: Upload SBOM
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-cyclonedx
          path: sbom.json
      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: OSV-Scanner
        uses: google/osv-scanner-action/osv-scanner-action@b1d267aea5211fa648d9d442fa64b90dbdcbdd36 # v2.7.0
        continue-on-error: true
        with:
          scan-args: |-
            --lockfile=package-lock.json
            --format=sarif
            --output=osv.sarif
      - name: Upload OSV SARIF
        # `always()` so the SARIF still uploads even when the OSV-Scanner step
        # itself errors after writing the file (it runs continue-on-error). The
        # `hashFiles` guard covers the other path: when an earlier gate (e.g. the
        # audit) fails, OSV-Scanner is skipped and osv.sarif never exists — an
        # unguarded upload then adds a bogus second failure ("Path does not
        # exist: osv.sarif") that masks the real one.
        if: always() && hashFiles('osv.sarif') != ''
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: osv.sarif
          category: osv-scanner

  codeql:
    name: CodeQL (JS/TS static analysis)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3

  deploy-manifests:
    name: Deploy manifests (compose config · helm lint · helm template)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.19.0
      - name: Render and lint compose files and Helm charts
        run: bash scripts/check-deploy-manifests.sh

  docker:
    name: Docker build + image scan (Trivy)
    runs-on: ubuntu-latest
    needs: [quality]
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          load: true # load into the local daemon so Trivy can scan the built image
          tags: kaiban-distributed:ci-${{ github.sha }}
      # Blocking gate: fail the build on a FIXABLE CRITICAL/HIGH OS or library CVE
      # in the runtime image (unfixed base-image CVEs are reported but don't block).
      - name: Scan image (Trivy — gate on fixable CRITICAL/HIGH)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: kaiban-distributed:ci-${{ github.sha }}
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          trivyignores: .trivyignore
          exit-code: "1"
        env:
          TRIVY_DB_REPOSITORY: ghcr.io/aquasecurity/trivy-db
      # Always publish the full SARIF to the Security tab, even when the gate fails.
      - name: Scan image (Trivy — SARIF report)
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: kaiban-distributed:ci-${{ github.sha }}
          format: sarif
          output: trivy.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          trivyignores: .trivyignore
          exit-code: "0"
        env:
          TRIVY_DB_REPOSITORY: ghcr.io/aquasecurity/trivy-db
      - name: Upload Trivy SARIF to code scanning
        if: always()
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: trivy.sarif
          category: trivy-image
