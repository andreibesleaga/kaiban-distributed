name: Publish to npm (Apache-2.0 core · provenance)

# Publishes the Apache-2.0 LIBRARY CORE to the npm registry WITH build provenance.
#
# Why this can't be done locally: npm provenance requires a CI OIDC id-token
# (`Automatic provenance generation not supported for provider: null` when run
# off a laptop). And the publish MUST go through scripts/pack-staging.sh so the
# GPL-3.0 root LICENSE (the *application* license) never leaks into the
# Apache-2.0 *library* tarball — npm force-includes a root LICENSE regardless of
# the `files` allow-list (ADR-011). The staging script assembles a clean dir
# whose only LICENSE is LICENSE-APACHE, then `npm publish --provenance`.
#
# Authentication is npm trusted publishing (OIDC): no NPM_TOKEN. npm exchanges
# the job's id-token for a short-lived publish token (npm >= 11.5.1). The
# trusted publisher on npmjs.com must name this file:
#   npm trust github kaiban-distributed --file publish-npm.yml --repo andreibesleaga/kaiban-distributed --allow-publish
#
# Triggers: every NON-prerelease version tag, and manual (workflow_dispatch) to
# (re)publish a tag: `gh workflow run publish-npm.yml --ref vX.Y.Z`. Not the
# `release: published` event: release.yml creates the release with
# GITHUB_TOKEN, and events made with GITHUB_TOKEN start no other workflow.

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  publish:
    name: npm publish (staging dir · provenance)
    runs-on: ubuntu-latest
    # On the tag trigger, skip prereleases (e.g. v2.0.0-beta → has a '-'),
    # which must never go to the `latest` dist-tag. Manual dispatch always runs.
    if: ${{ github.event_name == 'workflow_dispatch' || !contains(github.ref_name, '-') }}
    permissions:
      contents: read
      id-token: write # REQUIRED: npm trusted publishing + build provenance (OIDC)
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
          registry-url: "https://registry.npmjs.org"
      # npm 11.17.0, the npm Dependabot writes lockfiles with: a lockfile written by npm 11
      # can omit optional nested entries that npm 10 (bundled with Node 22) then reports
      # as "Missing ... from lock file". Keep in step with packageManager in package.json.
      - name: Use npm 11.17.0
        run: npm install -g npm@11.17.0
      - run: npm ci
      # The tag push starts this job in parallel with release.yml, so the
      # publish carries its own gate: npm versions cannot be republished.
      - name: Gate — typecheck, lint, unit tests with coverage thresholds
        run: |
          npm run typecheck
          npm run lint
          npm run test:coverage
      # Same consumer check as release.yml: release.yml runs in parallel and
      # cannot stop this job, so the tarball's exports are checked here too.
      - name: Gate — consumer smoke test (packed tarball installs; both entry points import)
        run: bash scripts/smoke-consumer.sh
      # pack-staging.sh --publish: build → assemble Apache-2.0-only staging dir
      # (no GPL LICENSE leak) → strip lifecycle scripts/devDeps → publish with
      # provenance + public access. publishConfig in package.json already pins
      # access:public + provenance:true; both the publish login and provenance
      # come from the job's OIDC id-token (trusted publishing).
      - name: Publish Apache-2.0 core to npm (with provenance)
        run: bash scripts/pack-staging.sh --publish
